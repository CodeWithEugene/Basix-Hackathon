[project]
name = "mizani"
version = "0.1.0"
description = "Mizani: two Omega agents reconcile a maternal referral (FastAPI + PeTTa + MeTTa)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "httpx>=0.28",
    "janus-swi==1.5.3",
    "petta",
    "typesafe-sdk==0.7.2",
]

[tool.uv.sources]
petta = { path = "vendor/petta", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["mizani"]
concurrency = ["multiprocessing", "thread"]

[tool.coverage.paths]
source = ["mizani", "*/mizani"]
